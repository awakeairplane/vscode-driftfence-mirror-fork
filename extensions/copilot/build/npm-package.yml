trigger:
  batch: true
  branches:
    include:
      - main

pr: [main]

resources:
  repositories:
    - repository: templates
      type: github
      name: microsoft/vscode-engineering
      ref: main
      endpoint: Monaco
  pipelines:
    - pipeline: pre-release
      source: 'copilot-chat (pre-release)'
      trigger:
        branches:
          include:
            - main
    - pipeline: stable
      source: 'copilot-chat (stable)'
      trigger:
        branches:
          include:
            - main

parameters:
  - name: nextVersion
    displayName: '🚀 Release Version (eg: none, major, minor, patch, prerelease, or X.X.X)'
    type: string
    default: 'none'

name: "$(Date:yyyyMMdd).$(Rev:r)${{ replace(format(' (🚀 {0})', parameters.nextVersion), ' (🚀 none)', '') }}"

extends:
  template: azure-pipelines/npm-package/pipeline.yml@templates
  parameters:
    npmPackages:
      - name: vscode-copilot-chat
        buildSteps:
          - task: NodeTool@0
            inputs:
              versionSpec: 22.x
            displayName: 🛠 Install Node.js (22.x)

          - bash: npm ci && npm run extract-chat-lib && rm -rf node_modules
            displayName: 📂 Extract chat-lib
            workingDirectory: extensions/copilot

          - script: npm ci
            displayName: 📦 Install chat-lib dependencies
            workingDirectory: extensions/copilot/chat-lib

          - script: npm run build
            displayName: 🔨 Build chat-lib
            workingDirectory: extensions/copilot/chat-lib
        testPlatforms:
          - name: Linux
            nodeVersions: [22.x]
          - name: MacOS
            nodeVersions: [22.x]
          - name: Windows
            nodeVersions: [22.x]
        workingDirectory: extensions/copilot/chat-lib
        testSteps:
          - bash: npm ci && npm run extract-chat-lib && rm -rf node_modules
            displayName: 📂 Extract chat-lib
            workingDirectory: extensions/copilot

          - script: npm ci
            displayName: 📦 Install chat-lib dependencies
            workingDirectory: extensions/copilot/chat-lib

          - script: npm run build
            displayName: 🔨 Build chat-lib
            workingDirectory: extensions/copilot/chat-lib

          - script: npm test
            displayName: 🧪 Run chat-lib tests
            workingDirectory: extensions/copilot/chat-lib
        # Triggered by pre-release pipeline → publish to next
        ${{ if eq(variables['resources.pipeline.pre-release.pipelineName'], 'copilot-chat (pre-release)') }}:
          publishPackage: true
          publishRequiresApproval: false
          tag: next
        # Triggered by stable pipeline → publish to latest
        ${{ elseif eq(variables['resources.pipeline.stable.pipelineName'], 'copilot-chat (stable)') }}:
          publishPackage: true
          publishRequiresApproval: false
        ${{ elseif eq(parameters.nextVersion, 'none') }}:
          publishPackage: false
        # Manual prerelease → publish to next
        ${{ elseif eq(parameters.nextVersion, 'prerelease') }}:
          publishPackage: true
          publishRequiresApproval: false
          nextVersion: prerelease
          tag: next
        ${{ else }}:
          publishPackage: true
          nextVersion: ${{ parameters.nextVersion }}
        ghCreateRelease: false
        ghReleaseAddChangeLog: false